apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 2

  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: o11y-postgres
    major: 18

  affinity:
    podAntiAffinityType: required

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  postgresql:
    extensions:
      - name: pg_tracing
      - name: pg_stat_ch
    shared_preload_libraries:
      - pg_tracing
      - pg_stat_ch
    parameters:
      compute_query_id: "on"
      track_io_timing: "on"
      log_min_duration_statement: "20"

      pg_tracing.otel_endpoint: http://otel-gateway-collector.o11y.svc:4318/v1/traces
      pg_tracing.otel_naptime: "2000"
      # Random sampling is enabled for the tpcc database only, which keeps the
      # operator's queries out. A sampled traceparent is always traced.
      pg_tracing.sample_rate: "0"

      pg_stat_ch.use_otel: "on"
      pg_stat_ch.otel_endpoint: otel-gateway-collector.o11y.svc:4317

  bootstrap:
    initdb:
      database: tpcc
      owner: tpcc
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_tracing
        - CREATE EXTENSION IF NOT EXISTS pg_stat_ch
        - ALTER DATABASE tpcc SET pg_tracing.sample_rate = 0.05

  monitoring:
    customQueriesConfigMap:
      - name: pg-monitoring
        key: queries

  storage:
    size: 20Gi
