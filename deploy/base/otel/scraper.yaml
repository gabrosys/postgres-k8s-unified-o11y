apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-scraper
spec:
  mode: statefulset
  replicas: 1
  serviceAccount: otel-scraper
  targetAllocator:
    enabled: true
    serviceAccount: otel-scraper-ta
    prometheusCR:
      enabled: true
      scrapeInterval: 30s
      podMonitorSelector: {}
      podMonitorNamespaceSelector: {}
      serviceMonitorSelector: {}
      serviceMonitorNamespaceSelector: {}
  observability:
    metrics:
      enableMetrics: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  env:
    - name: GOMEMLIMIT
      value: 400MiB
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      prometheus:
        config:
          scrape_configs:
            # The kubelet serves cAdvisor; it is reached through the apiserver proxy.
            - job_name: cadvisor
              scrape_interval: 60s
              scheme: https
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - target_label: __address__
                  replacement: kubernetes.default.svc:443
                - source_labels: [__meta_kubernetes_node_name]
                  regex: (.+)
                  target_label: __metrics_path__
                  replacement: /api/v1/nodes/$$1/proxy/metrics/cadvisor
              metric_relabel_configs:
                - source_labels: [__name__]
                  action: keep
                  regex: container_(cpu|memory)_.*
                - source_labels: [namespace]
                  action: keep
                  regex: (o11y|pg-.*)

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

    exporters:
      otlp_grpc:
        # Through the ClusterIP Service every connection would stick to one gateway.
        endpoint: dns:///otel-gateway-collector-headless.o11y.svc:4317
        balancer_name: round_robin
        tls:
          insecure: true

    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter]
          exporters: [otlp_grpc]
