apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: clickhouse
spec:
  selector:
    matchLabels:
      clickhouse.altinity.com/chi: otel
  podMetricsEndpoints:
    - port: metrics
      metricRelabelings:
        - sourceLabels: [__name__]
          action: keep
          regex: ClickHouse(AsyncMetrics_(MaxPartCountForPartition|TotalPartsOfMergeTreeTables|ReplicasMaxAbsoluteDelay)|Metrics_(PartsActive|Merge|ReadonlyReplica|MemoryTracking|DelayedInserts)|ProfileEvents_(InsertQuery|FailedInsertQuery|RejectedInserts|DelayedInserts|InsertedRows))
