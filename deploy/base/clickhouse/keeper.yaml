apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: otel
spec:
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 3
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: data
  templates:
    podTemplates:
      - name: keeper
        podDistribution:
          - type: ShardAntiAffinity
        spec:
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:26.7.5.10
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
    volumeClaimTemplates:
      - name: data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
