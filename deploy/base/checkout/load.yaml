apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-load
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-load
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.17.0@sha256:935d9100e9ba842cdb060de42472c7ca90cfe9a7c96e4dacb55e79e560b3ff40
          command:
            - sh
            - -c
            - |
              while true; do
                curl -s -o /dev/null -X POST --max-time 10 http://checkout:8080/checkout
                sleep "$(awk "BEGIN { print 1 / ${RATE} }")"
              done
          env:
            - {name: RATE, value: "5"}
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
