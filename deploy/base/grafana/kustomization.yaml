apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: o11y
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: grafana-datasources
    files:
      - datasource.yaml
  - name: grafana-dashboard-providers
    files:
      - provider.yaml
  - name: grafana-dashboards
    files:
      - dashboards/pg-service.json
      - dashboards/pg-fleet.json
      - dashboards/pg-query.json
      - dashboards/pg-trace.json
      - dashboards/o11y-pipeline.json
