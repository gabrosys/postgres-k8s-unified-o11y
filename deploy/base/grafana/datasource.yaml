apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse-otel.o11y.svc
      port: 9000
      protocol: native
      username: grafana
      # clickhouse-go sends max_execution_time a few seconds above the query timeout;
      # the grafana profile rejects anything above 60.
      queryTimeout: "55"
      defaultDatabase: otel
      # The plugin identifies OTel schema 1.3.0 as "1.30.0".
      logs:
        defaultDatabase: otel
        defaultTable: otel_logs
        otelEnabled: true
        otelVersion: "1.30.0"
      traces:
        defaultDatabase: otel
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: "1.30.0"
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
